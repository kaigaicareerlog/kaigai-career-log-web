name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      episode_guid:
        description: 'Episode GUID to transcribe'
        required: true
        type: string
      num_speakers:
        description: 'Exact number of speakers (Scribe only, leave empty to auto-detect)'
        required: false
        type: string
      force:
        description: 'Redo an episode that was already transcribed with Scribe'
        required: false
        type: boolean
        default: false
      generate_highlights:
        description: 'Generate highlights after transcription'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

# One transcription at a time, so the monthly budget check can't be raced
concurrency:
  group: transcription
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run transcription
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MONTHLY_TRANSCRIPTION_BUDGET_USD: ${{ vars.MONTHLY_TRANSCRIPTION_BUDGET_USD || '5' }}
          EPISODE_GUID: ${{ inputs.episode_guid }}
          NUM_SPEAKERS: ${{ inputs.num_speakers }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=("$EPISODE_GUID")
          if [ -n "$NUM_SPEAKERS" ]; then ARGS+=("--speakers=$NUM_SPEAKERS"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=("--force"); fi
          npx tsx scripts/transcribe-episode.ts "${ARGS[@]}"

      # Record spend on main straight away, even if the transcript PR is
      # never merged, so the monthly budget check stays accurate
      - name: Record transcription usage
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/transcriptionUsage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record transcription usage for ${{ inputs.episode_guid }}"
            git push
          fi

      # Groq steps may fail (e.g. daily limit); the paid transcript still
      # goes to the PR and these can be rerun later
      - name: Generate highlights
        if: ${{ inputs.generate_highlights }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate-highlights ${{ inputs.episode_guid }}

      - name: Name speakers
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/name-speakers.ts ${{ inputs.episode_guid }} --report="$RUNNER_TEMP/speakers.md" \
            || echo "⚠️ 話者名の自動付与に失敗しました。Update Transcript Speakers ワークフローで付けてください。" > "$RUNNER_TEMP/speakers.md"

      - name: Write PR description
        run: |
          {
            echo "Scribe で文字起こししました。マージするとサイトに公開されます。"
            echo
            cat "$RUNNER_TEMP/speakers.md" 2>/dev/null || true
            echo
            echo "- Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: public/transcripts/${{ inputs.episode_guid }}.json
          commit-message: 'Add transcription for episode ${{ inputs.episode_guid }}'
          title: '🎙️ Transcript: ${{ inputs.episode_guid }}'
          body-path: ${{ runner.temp }}/pr-body.md
          branch: automated/transcript-${{ inputs.episode_guid }}
          delete-branch: true
          labels: |
            automated
            transcript
