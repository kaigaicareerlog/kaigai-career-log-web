name: Transcribe Episode

on:
  workflow_dispatch:
    inputs:
      episode_guid:
        description: 'Episode GUID to transcribe'
        required: true
        type: string
      num_speakers:
        description: 'Exact number of speakers (Scribe only, leave empty to auto-detect)'
        required: false
        type: string
      force:
        description: 'Redo an episode that was already transcribed with Scribe'
        required: false
        type: boolean
        default: false
      generate_highlights:
        description: 'Generate highlights after transcription'
        required: false
        type: boolean
        default: true
  # Called once per episode by transcribe-new-episodes.yml
  workflow_call:
    inputs:
      episode_guid:
        required: true
        type: string
      num_speakers:
        required: false
        type: string
      force:
        required: false
        type: boolean
        default: false
      generate_highlights:
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    # One transcription at a time, so the monthly budget check can't be raced
    concurrency:
      group: transcription
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Run transcription
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MONTHLY_TRANSCRIPTION_BUDGET_USD: ${{ vars.MONTHLY_TRANSCRIPTION_BUDGET_USD || '5' }}
          EPISODE_GUID: ${{ inputs.episode_guid }}
          NUM_SPEAKERS: ${{ inputs.num_speakers }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=("$EPISODE_GUID")
          if [ -n "$NUM_SPEAKERS" ]; then ARGS+=("--speakers=$NUM_SPEAKERS"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=("--force"); fi
          npx tsx scripts/transcribe-episode.ts "${ARGS[@]}"

      # Record spend on main straight away, even if a later step fails, so the
      # monthly budget check stays accurate. The transcript itself stays
      # uncommitted (autostash) until the publish step.
      - name: Record transcription usage
        run: |
          git add src/data/transcriptionUsage.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record transcription usage for ${{ inputs.episode_guid }}"
            git pull --rebase --autostash
            git push
          fi

      # Groq steps may fail (e.g. daily limit); the paid transcript is still
      # published and these can be rerun later
      - name: Generate highlights
        if: ${{ inputs.generate_highlights }}
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run generate-highlights ${{ inputs.episode_guid }}

      - name: Name speakers
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/name-speakers.ts ${{ inputs.episode_guid }} --report="$RUNNER_TEMP/speakers.md" \
            || echo "⚠️ 話者名の自動付与に失敗しました。Update Transcript Speakers ワークフローで付けてください。" > "$RUNNER_TEMP/speakers.md"

      # Redo the episode's tags now that the guests' self-introductions are
      # available. Reviewed tags are left alone. Tags go straight to main like
      # the daily RSS tagging, so separate transcript PRs never conflict.
      - name: Retag episode with the transcript
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/tag-episodes.ts --guid=${{ inputs.episode_guid }} --force --keep-reviewed
          git add src/data/episodeMeta.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: retag episode ${{ inputs.episode_guid }} from its transcript"
            git pull --rebase --autostash
            git push
          fi

      # Publish straight to main (no review PR). Speaker names the model was
      # unsure about stay as speaker_N; fix them with Update Transcript Speakers.
      - name: Publish transcript
        run: |
          cat "$RUNNER_TEMP/speakers.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          git add public/transcripts/${{ inputs.episode_guid }}.json
          git commit -m "Add transcription for episode ${{ inputs.episode_guid }}"
          git pull --rebase
          git push
