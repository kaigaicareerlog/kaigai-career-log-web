name: Update RSS Feed

on:
  # 毎日午後4時（バンクーバー時間）に実行（UTC 23:00）
  # Runs daily at 4pm Vancouver time (23:00 UTC = 4pm PDT / 3pm PST)
  schedule:
    - cron: '0 23 * * *'

  # 手動実行も可能
  workflow_dispatch:

jobs:
  update-rss:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Set timestamp
        id: timestamp
        run: |
          echo "datetime=$(TZ=Asia/Tokyo date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Download latest RSS feed
        run: |
          FILENAME="public/rss/${{ steps.timestamp.outputs.datetime }}-rss-file.xml"
          curl -o "$FILENAME" https://anchor.fm/s/105976b60/podcast/rss
          echo "New RSS file created: $FILENAME"

      - name: Update channel info
        run: |
          XMLFILE="public/rss/${{ steps.timestamp.outputs.datetime }}-rss-file.xml"
          npx tsx scripts/update-channel-info.ts "$XMLFILE" "public/rss/channel-info.json"
          echo "Channel info updated"

      - name: Generate episodes
        run: |
          XMLFILE="public/rss/${{ steps.timestamp.outputs.datetime }}-rss-file.xml"
          EPISODESFILE="public/rss/${{ steps.timestamp.outputs.datetime }}-episodes.json"
          npx tsx scripts/generate-episodes.ts "$XMLFILE" "$EPISODESFILE"
          echo "Generated episodes: $EPISODESFILE"

      - name: Delete old files
        run: npx tsx scripts/cleanup-old-rss-files.ts

      - name: Update all platform URLs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          EPISODESFILE="public/rss/${{ steps.timestamp.outputs.datetime }}-episodes.json"
          echo "Finding all platform URLs for new episodes..."
          npx tsx scripts/update-new-episode-urls.ts "$EPISODESFILE"

      - name: Tag new episodes (guest info and tags)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Never let a tagging problem block the RSS update
          npx tsx scripts/tag-episodes.ts || echo "Episode tagging failed; continuing"

      # X's API now requires paid pay-per-use credits (posting used to be free),
      # so instead of posting automatically this opens a GitHub issue with the
      # tweet text ready to copy/paste (or open X pre-filled) and assigns it,
      # which notifies the assignee. See docs/EPISODE_TAGGING.md's neighbor,
      # scripts/notify-episode-to-post-x.ts, for details.
      # To resume automatic posting once X credits are funded again, swap
      # this step back to `npx tsx scripts/auto-post-episode-to-x.ts` with the
      # X_* secrets (see git history for the previous version of this step).
      - name: Notify about episode to post to X
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Looking for episodes to post to X..."
          npx tsx scripts/notify-episode-to-post-x.ts "@togashi_ryo, @onepercentdsgn, @Isobe_Hiroshi" ryonryon || echo "Notification failed; continuing"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/rss/ src/data/episodeMeta.json
          git diff --staged --quiet || git commit -m "chore: Update RSS feed and post episode intro - ${{ steps.timestamp.outputs.datetime }}"
          git push
