name: Update Episode URLs Manually

on:
  workflow_dispatch:
    inputs:
      guid:
        description: 'Episode GUID (found in episodes.json)'
        required: true
        type: string
      spotify_url:
        description: 'Spotify URL (leave empty to skip)'
        required: false
        type: string
        default: ''
      youtube_url:
        description: 'YouTube URL (leave empty to skip)'
        required: false
        type: string
        default: ''
      apple_podcast_url:
        description: 'Apple Podcast URL (leave empty to skip)'
        required: false
        type: string
        default: ''
      amazon_music_url:
        description: 'Amazon Music URL (leave empty to skip)'
        required: false
        type: string
        default: ''

jobs:
  update-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Find latest episodes file
        id: find-file
        run: |
          EPISODES_FILE=$(npx tsx -e "import {findLatestEpisodesFile} from './src/utils/findLatestEpisodesFile'; console.log(findLatestEpisodesFile())")
          echo "episodes_file=$EPISODES_FILE" >> $GITHUB_OUTPUT
          echo "📁 Found episodes file: $EPISODES_FILE"

      - name: Display update information
        env:
          GUID: ${{ inputs.guid }}
          SPOTIFY_URL: ${{ inputs.spotify_url }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          APPLE_URL: ${{ inputs.apple_podcast_url }}
          AMAZON_URL: ${{ inputs.amazon_music_url }}
        run: |
          echo "🔄 Updating episode URLs"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📝 GUID: $GUID"
          echo ""
          if [ -n "$SPOTIFY_URL" ]; then
            echo "🎵 Spotify: $SPOTIFY_URL"
          fi
          if [ -n "$YOUTUBE_URL" ]; then
            echo "🎥 YouTube: $YOUTUBE_URL"
          fi
          if [ -n "$APPLE_URL" ]; then
            echo "🍎 Apple Podcast: $APPLE_URL"
          fi
          if [ -n "$AMAZON_URL" ]; then
            echo "📦 Amazon Music: $AMAZON_URL"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Update episode URLs
        env:
          EPISODES_FILE: ${{ steps.find-file.outputs.episodes_file }}
          GUID: ${{ inputs.guid }}
          SPOTIFY_URL: ${{ inputs.spotify_url }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          APPLE_URL: ${{ inputs.apple_podcast_url }}
          AMAZON_URL: ${{ inputs.amazon_music_url }}
        run: |
          # Build the arguments as an array so input values are never
          # evaluated as shell code
          ARGS=("$EPISODES_FILE" "$GUID")

          if [ -n "$SPOTIFY_URL" ]; then
            ARGS+=(--spotify "$SPOTIFY_URL")
          fi

          if [ -n "$YOUTUBE_URL" ]; then
            ARGS+=(--youtube "$YOUTUBE_URL")
          fi

          if [ -n "$APPLE_URL" ]; then
            ARGS+=(--apple "$APPLE_URL")
          fi

          if [ -n "$AMAZON_URL" ]; then
            ARGS+=(--amazon "$AMAZON_URL")
          fi

          npx tsx scripts/update-episode-by-guid.ts "${ARGS[@]}"

      - name: Commit and push changes
        env:
          GUID: ${{ inputs.guid }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/rss/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit"
          else
            git commit -m "chore: Manual URL update for episode $GUID"
            git push
            echo "✅ Changes committed and pushed successfully"
          fi
