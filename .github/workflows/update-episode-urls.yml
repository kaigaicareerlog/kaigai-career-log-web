name: Update Episode URLs

on:
  workflow_dispatch:
    inputs:
      guid:
        description: 'Episode GUID (leave empty to update all episodes)'
        required: false
        type: string
      update_spotify:
        description: 'Update Spotify URLs'
        required: false
        default: true
        type: boolean
      update_youtube:
        description: 'Update YouTube URLs'
        required: false
        default: true
        type: boolean
      update_apple:
        description: 'Update Apple Podcast URLs'
        required: false
        default: true
        type: boolean
      update_amazon:
        description: 'Update Amazon Music URLs'
        required: false
        default: true
        type: boolean

jobs:
  update-episode-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Find latest episodes file
        id: episodes
        run: |
          EPISODES_FILE=$(npx tsx -e "import {findLatestEpisodesFile} from './src/utils/findLatestEpisodesFile'; console.log(findLatestEpisodesFile())")
          echo "file=$EPISODES_FILE" >> "$GITHUB_OUTPUT"
          echo "Using $EPISODES_FILE"

      - name: Update Episode URLs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EPISODE_GUID: ${{ inputs.guid }}
          UPDATE_SPOTIFY: ${{ inputs.update_spotify }}
          UPDATE_YOUTUBE: ${{ inputs.update_youtube }}
          UPDATE_APPLE: ${{ inputs.update_apple }}
          UPDATE_AMAZON: ${{ inputs.update_amazon }}
        run: |
          PLATFORMS_UPDATED=()
          if [ "$UPDATE_SPOTIFY" = "true" ]; then PLATFORMS_UPDATED+=("Spotify"); fi
          if [ "$UPDATE_YOUTUBE" = "true" ]; then PLATFORMS_UPDATED+=("YouTube"); fi
          if [ "$UPDATE_APPLE" = "true" ]; then PLATFORMS_UPDATED+=("Apple Podcasts"); fi
          if [ "$UPDATE_AMAZON" = "true" ]; then PLATFORMS_UPDATED+=("Amazon Music"); fi

          if [ ${#PLATFORMS_UPDATED[@]} -eq 0 ]; then
            echo "No platforms selected"
            exit 0
          fi

          PLATFORMS_LIST=$(IFS=", "; echo "${PLATFORMS_UPDATED[*]}")
          echo "PLATFORMS_UPDATED=$PLATFORMS_LIST" >> "$GITHUB_ENV"
          # Same command as the daily RSS job. It fills empty URLs only.
          # UPDATE_* and EPISODE_GUID narrow that; unset, the script updates
          # every platform, which is the daily behavior.
          npx tsx scripts/update-new-episode-urls.ts "${{ steps.episodes.outputs.file }}"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update episode URLs (${{ env.PLATFORMS_UPDATED }})'
          title: '🔗 Update Episode URLs (${{ env.PLATFORMS_UPDATED }})'
          body: |
            ## 🔗 Automated Episode URL Update

            This PR was automatically generated by the GitHub Action workflow.

            ### Changes
            - Platforms: **${{ env.PLATFORMS_UPDATED }}**
            - Filled empty platform URLs via `update-new-episode-urls` (existing URLs are kept)
            ${{ inputs.guid && format('- Episode GUID: **{0}**', inputs.guid) || '- Updated all episodes missing URLs' }}

            ### Platform Selection
            - Spotify: ${{ inputs.update_spotify && '✅' || '❌' }}
            - YouTube: ${{ inputs.update_youtube && '✅' || '❌' }}
            - Apple Podcast: ${{ inputs.update_apple && '✅' || '❌' }}
            - Amazon Music: ${{ inputs.update_amazon && '✅' || '❌' }}

            ### Details
            - Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Triggered by: ${{ github.event_name }}

            Please review the changes and merge if everything looks good! 🚀
          branch: automated/update-episode-urls
          delete-branch: true
          labels: |
            automated
            episode-urls
            enhancement

      - name: Summary
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "✅ Pull request created successfully!"
          echo "Check the 'Pull Requests' tab to review and merge the changes."
