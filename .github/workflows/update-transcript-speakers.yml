name: Update Transcript Speakers

on:
  workflow_dispatch:
    inputs:
      episode_guid:
        description: 'Episode GUID'
        required: true
        type: string
      speaker_a_name:
        description: 'Speaker A / speaker_0 name (leave empty to skip)'
        required: false
        type: string
      speaker_b_name:
        description: 'Speaker B / speaker_1 name (leave empty to skip)'
        required: false
        type: string
      speaker_c_name:
        description: 'Speaker C / speaker_2 name (leave empty to skip)'
        required: false
        type: string
      speaker_d_name:
        description: 'Speaker D / speaker_3 name (leave empty to skip)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-speakers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update speaker labels
        env:
          EPISODE_GUID: ${{ inputs.episode_guid }}
          SPEAKER_A: ${{ inputs.speaker_a_name }}
          SPEAKER_B: ${{ inputs.speaker_b_name }}
          SPEAKER_C: ${{ inputs.speaker_c_name }}
          SPEAKER_D: ${{ inputs.speaker_d_name }}
        run: |
          npx tsx scripts/update-transcript-speakers.ts \
            "$EPISODE_GUID" \
            "$SPEAKER_A" \
            "$SPEAKER_B" \
            "$SPEAKER_C" \
            "$SPEAKER_D"

      - name: Commit and push changes
        env:
          EPISODE_GUID: ${{ inputs.episode_guid }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "public/transcripts/$EPISODE_GUID.json"
          git diff --staged --quiet || git commit -m "Update transcript speakers for $EPISODE_GUID"
          git push
